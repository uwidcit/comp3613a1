# Render Blueprint for COMP 3613.
# Students deploy with the Render MCP (create the database, then the web service).
# Do not also apply this file in the Dashboard or you will create a second copy.
# Free web services sleep after inactivity. Free Postgres expires after 30 days.

services:
  - type: web
    name: fastmvc
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install .
    startCommand: python manage.py init --no-drop && python manage.py seed && python manage.py run --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENV
        value: production
      - key: DATABASE_URI
        fromDatabase:
          name: fastmvc-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: fastmvc-db
    databaseName: fastmvc
    plan: free
    region: oregon
    postgresMajorVersion: "16"
