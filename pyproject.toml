[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-starter"
version = "0.0.1"
description = "Starter repository for student's projects for info 2602"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kwasi Edwards", email = "kwasiedwards@gmail.com" }
]
dependencies = [
    "asyncpg==0.31.0",
    "fastapi[all]==0.141.1",
    "fpdf2==2.8.8",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "pwdlib[argon2]==0.3.1",
    "psycopg2-binary==2.9.13",
    "pyjwt==2.14.0",
    "python-jose==3.5.0",
    "pytest-asyncio==1.4.0",
    "pytest==9.1.1",
    "ruff==0.16.7",
    "sqlmodel==0.0.42",
    "tabulate==0.10.0",
    "uvicorn[standard]==0.53.0",
    "pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
    "pip-tools==7.6.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["app"]